%YAML:1.0

Camera.type: "Monocular"

# Thông số đã tính toán lại theo tỷ lệ mới
Camera.fx: 707.0375
Camera.fy: 1061.859375
Camera.cx: 342.80625
Camera.cy: 240.533

# Các hệ số biến dạng giữ nguyên là 0.0 nếu ảnh gốc đã được khử méo (undistorted)
Camera.k1: 0.0
Camera.k2: 0.0
Camera.p1: 0.0
Camera.p2: 0.0

# Kích thước ảnh mới
Camera.width: 640
Camera.height: 480

Camera.fps: 30.0
Camera.RGB: 1

# Tăng nFeatures để bù đắp việc mất chi tiết khi giảm độ phân giải
ORBextractor.nFeatures: 3000 
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3
Viewer.ViewpointX: 0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500
